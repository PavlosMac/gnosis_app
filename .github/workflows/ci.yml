name: CI
on:
  push:
    branches: [main]
    paths: ["backend/**", "docs/**", "CLAUDE.md", "*/CLAUDE.md", "frontend/src/content/legal/README.md", ".github/workflows/ci.yml"]
  pull_request:
    paths: ["backend/**", "docs/**", "CLAUDE.md", "*/CLAUDE.md", "frontend/src/content/legal/README.md", ".github/workflows/ci.yml"]

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 backend/scripts/check_docs_links.py

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      JWT_SECRET_KEY: ci-only-secret   # Settings needs it at import time
      MONGODB_URI: mongodb://ci-only-unused:27017   # required by Settings; tests use mongomock
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.7"   # same pin as backend/Dockerfile; bump both together
          enable-cache: true
      - run: uv sync
      - run: make lint
      - run: make prompt-doc-check
      - run: make test
      # Dependency audit of what ships (no dev group). An advisory with no fix for a path
      # this app does not use gets an `--ignore-vuln <id>` with a comment here, never
      # `continue-on-error`. See docs/notes/security-watchlist.md §1.
      - name: pip-audit (runtime dependencies)
        run: |
          uv export --frozen --no-dev --format requirements-txt --no-hashes -o /tmp/requirements.txt
          uvx pip-audit==2.10.1 -r /tmp/requirements.txt --no-deps
