services:
  mongodb:
    image: mongo:7
    command: ["mongod", "--setParameter", "logComponentVerbosity={network: {verbosity: -1}, accessControl: {verbosity: -1}}"]
    ports:
      - "27019:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "bash", "-c", "mongosh --eval \"db.runCommand('ping').ok\" --quiet > /dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - "8001:8000"
    env_file: .env
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      - MONGODB_URI=mongodb://mongodb:27017

volumes:
  mongo_data:
