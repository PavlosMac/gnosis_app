services:
  mongodb:
    image: mongo:7
    command: ["mongod"]
    logging:
      driver: "none"
    ports:
      - "27019:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "bash", "-c", "</dev/tcp/127.0.0.1/27017"]
      interval: 20s
      timeout: 5s
      retries: 3

  api:
    build: .
    ports:
      - "8001:8000"
    env_file: .env
    volumes:
      - ./src:/app/src
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      - MONGODB_URI=mongodb://mongodb:27017
    command: [".venv/bin/uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

volumes:
  mongo_data:
