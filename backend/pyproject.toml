[project]
name = "gnosis-esoterica-backend"
version = "0.1.0"
description = "Tarot & esoteric reading platform backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "motor>=3.6.0",
    "pydantic[email]>=2.10.0",
    "pydantic-settings>=2.14.2",
    # Floors below are security fixes (docs/notes/security-watchlist.md §3, 2026-11-10);
    # a fresh lock must not resolve below them.
    "pyjwt>=2.15.0",
    "pwdlib[argon2]>=0.2.0",
    "structlog>=25.5.0",
    "openai>=1.60.0",
    "mollie-api-py>=1.10.2",
    "python-multipart>=0.0.32",
    "anthropic>=1.2.0",
    "resend>=2.44.0",
    # Transitive, pinned up on purpose: starlette 1.3.1+ validates Host/path before
    # building request.url; certifi 2026.10.19+ drops the compromised emSign chain.
    "starlette>=1.3.1",
    "certifi>=2026.10.19",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "httpx>=0.28.0",
    "ruff>=0.9.0",
    "pre-commit>=4.0.0",
    "mongomock-motor>=0.0.34",
    "pyright>=1.1.408",
    "python-dotenv>=1.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["load: concurrency load tests — slow, excluded by default, run with `make test-load`"]
addopts = "-m 'not load'"

[tool.pyright]
pythonVersion = "3.12"
include = ["src", "scripts"]
typeCheckingMode = "basic"
reportMissingImports = true
reportMissingModuleSource = true

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [".claude", "docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["UP046"]

[tool.ruff.lint.per-file-ignores]
"src/llm/prompt_builder.py" = ["E501"]
