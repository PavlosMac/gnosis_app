[project]
name = "gnosis-esoterica-backend"
version = "0.1.0"
description = "Tarot & esoteric reading platform backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "motor>=3.6.0",
    "pydantic[email]>=2.10.0",
    "pydantic-settings>=2.7.0",
    "pyjwt>=2.10.0",
    "pwdlib[argon2]>=0.2.0",
    "structlog>=25.5.0",
    "openai>=1.60.0",
    "mollie-api-py>=1.10.2",
    "python-multipart>=0.0.32",
    "anthropic>=1.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "httpx>=0.28.0",
    "ruff>=0.9.0",
    "pre-commit>=4.0.0",
    "mongomock-motor>=0.0.34",
    "pyright>=1.1.408",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.pyright]
pythonVersion = "3.12"
include = ["src", "scripts"]
typeCheckingMode = "basic"
reportMissingImports = true
reportMissingModuleSource = true

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [".claude", "docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["UP046"]

[tool.ruff.lint.per-file-ignores]
"src/llm/prompt_builder.py" = ["E501"]
