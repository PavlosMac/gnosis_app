services:
  mongodb:
    image: mongo:7
    container_name: gnosis-mongodb
    command: ["mongod", "--auth", "--quiet", "--wiredTigerCacheSizeGB", "0.25"]
    ports:
      # ⚠️ SECURITY: the "127.0.0.1:" prefix is load-bearing — it binds Mongo to the
      # Pi's loopback only, reachable solely via SSH (Compass tunnel / pi-mongo.sh).
      #
      # NEVER shorten this to "27017:27017": that binds 0.0.0.0 and Docker inserts
      # its own iptables rules AHEAD of any host firewall (ufw), exposing the DB to
      # the whole LAN — and to the internet if the router ever port-forwards here.
      # Exposed MongoDBs are scanner-found and ransomed within hours.
      #
      # If this mapping is ever changed or removed, update
      # docs/database/configure_db.md §2 and production_mongo_commands.md §5.
      - "127.0.0.1:27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: gnosis_admin
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      GNOSIS_APP_PASSWORD: ${GNOSIS_APP_PASSWORD}
    volumes:
      - mongo_data:/data/db
      - ./mongo/init-user.js:/docker-entrypoint-initdb.d/init-user.js:ro
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "bash", "-c", "</dev/tcp/127.0.0.1/27017"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  api:
    image: pavlos888/gnosis-esoterica-api:latest
    container_name: gnosis-api
    # NO ports: — only reachable within app-network
    env_file: .env.gnosis.prod
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    stop_grace_period: 10s
    restart: unless-stopped

volumes:
  mongo_data:

networks:
  app-network:
    external: true
